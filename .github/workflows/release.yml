name: Release

# Builds a universal DMG and attaches it to the GitHub release. Either:
#   - publish a release in the GitHub UI (or `gh release create v1.1`), or
#   - push a tag like v1.1, which creates the release.
# The tag must match CFBundleShortVersionString in Resources/Info.plist.
# Release notes are generated from the commits since the previous tag, unless written when publishing.
# Run manually with a tag to rebuild an existing release and regenerate its notes.
#
# Release gate (#11): nothing is uploaded unless scripts/verify-release.sh accepts the DMG as Developer ID signed,
# Hardened Runtime, timestamped, notarized, stapled and universal (docs/RELEASE_SIGNING.md). This workflow doesn't sign
# yet, and the repository variable SPANDECK_TEAM_ID isn't set, so today every run stops at the first step, before
# building, and publishes nothing. Signing itself is a separate reviewed change (RELEASE_SIGNING.md, decision 3).
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild, for example v1.1
        required: true

# No token permissions by default; only the release job gets `contents: write`, which publishing needs (R11).
permissions: {}

# A release created in the UI also creates its tag; run once per tag.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
          # The token isn't stored in .git/config; only the publish step gets it, as GH_TOKEN.
          persist-credentials: false

      # Fails closed, before spending a build, when release signing isn't configured.
      - name: Check release signing is configured
        env:
          SPANDECK_TEAM_ID: ${{ vars.SPANDECK_TEAM_ID }}
        run: scripts/verify-release.sh --preflight

      - name: Check tag matches app version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag $TAG is not a version tag like v1.1"
            exit 1
          fi
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Info.plist version $version"
            exit 1
          fi

      - name: Build DMG
        run: ./build.sh dmg

      # The gate: the exact file uploaded below must pass. No `if:`, `continue-on-error` or `|| true` (check-workflows.py).
      - name: Verify release artifact
        env:
          SPANDECK_TEAM_ID: ${{ vars.SPANDECK_TEAM_ID }}
        run: scripts/verify-release.sh "build/SpanDeck-${TAG#v}.dmg"

      - name: Write release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            echo "## What's new"
            echo
            git log --no-merges --pretty='- %s' "${prev:+$prev..}$TAG" | grep -vE '^- (Bump version|Merge )' || true
            echo
            if [ -n "$prev" ]; then
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
              echo
            fi
            echo "Universal build for Apple Silicon and Intel, macOS 14 or newer. Developer ID signed and notarized; checked by scripts/verify-release.sh before upload."
          } > build/notes.md
          cat build/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/SpanDeck-${TAG#v}.dmg" --clobber
            # Keep notes written when publishing; a manual run regenerates them.
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
              gh release edit "$TAG" --notes-file build/notes.md
            fi
          else
            gh release create "$TAG" "build/SpanDeck-${TAG#v}.dmg" --title "SpanDeck ${TAG#v}" --notes-file build/notes.md
          fi
