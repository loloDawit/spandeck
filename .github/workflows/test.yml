name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the job only checks out and builds (R11).
permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check workflow hardening
        run: python3 -I scripts/check-workflows.py && python3 -I scripts/test_check_workflows.py
      - name: Run tests
        run: swift test
